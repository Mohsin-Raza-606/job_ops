version: "3.9"

services:
  db:
    image: postgres:15
    container_name: jobops-db
    environment:
      POSTGRES_DB: jobops
      POSTGRES_USER: jobopsuser
      POSTGRES_PASSWORD: jobopspass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: jobops-redis

  web:
    build: .
    container_name: jobops-web
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  worker:
    build: .
    container_name: jobops-worker
    command: celery -A config worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

  beat:
    build: .
    container_name: jobops-beat
    command: celery -A config beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
